<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🔒 GATE</title>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; text-align: center; padding: 100px; }
    input, button { padding: 15px; margin: 10px; font-size: 18px; width: 300px; }
    button { background: #0f0; color: #000; border: none; cursor: pointer; }
    .fail { color: red; }
  </style>
</head>
<body>
  <h1>🔒 ENTER KEY</h1>
  <form action="/unlock" method="POST">
    <input type="password" name="pass" placeholder="Password" required>
    <button>UNLOCK</button>
  </form>
  <script>
    if (location.search.includes('fail')) {
      document.write('<p class="fail">WRONG KEY</p>');
    }
  </script>
</body>
</html>
